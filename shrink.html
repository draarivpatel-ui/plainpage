<!doctype html><meta charset=utf-8><title>Plain Reader</title><meta name=viewport content=width=device-width,initial-scale=1><style>body{font:14px system-ui;background:#f6efe2;color:#222;max-width:44rem;margin:1rem auto;padding:0 1rem}textarea,pre{width:100%;box-sizing:border-box}pre{white-space:pre-wrap}</style><h1>Plain Reader</h1><p>Paste any text for a live readability, Flesch-Kincaid grade and jargon density check. All math runs in your browser, offline.</p><textarea id=t rows=8 oninput=go()></textarea><pre id=o></pre><script>function syl(w){w=w.toLowerCase().replace(/[^a-z]/g,'');if(w.length<4)return 1;w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'').replace(/^y/,'');var m=w.match(/[aeiouy]{1,2}/g);return m?m.length:1}function go(){var x=document.getElementById('t').value,W=x.match(/[a-z]+/gi)||[],n=W.length||1,S=(x.match(/[.!?]+/g)||[]).length||1,s=0,j=0,B='.utilize.utilization.facilitate.implement.leverage.paradigm.synergy.robust.streamline.optimize.granular.holistic.disseminate.ascertain.commence.terminate.subsequent.nevertheless.methodology.necessitate.procure.stipulate.substantiate.endeavor.approximately.demonstrate.modification.objective.';for(var i=0;i<W.length;i++){var w=W[i],k=syl(w);s+=k;if(B.indexOf('.'+w.toLowerCase()+'.')>=0)j++}var wps=n/S,spw=s/n,re=206.835-1.015*wps-84.6*spw,fk=0.39*wps+11.8*spw-15.59,jd=100*j/n,v=re>60?'Easy':re>30?'Fairly hard':'Hard';document.getElementById('o').innerHTML='Words: '+n+' | Sentences: '+S+' | Syllables: '+s+' | Jargon words: '+j+'<br>Reading Ease (Flesch): '+re.toFixed(1)+' ('+v+')<br>Flesch-Kincaid Grade: '+fk.toFixed(1)+'<br>Jargon density: '+jd.toFixed(1)+'%'}go()</script>
